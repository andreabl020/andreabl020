name: Actualizar tarjetas del perfil

on:
  schedule:
    - cron: "0 5 * * *"  # cada día a las 05:00 UTC
  workflow_dispatch:
  push:
    paths: ["profile.json", "scripts/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      # PROFILE_TOKEN (opcional) es un token personal con acceso de lectura a tus repos privados,
      # para que cuenten sus lenguajes y estrellas. Sin él solo se usan los repos públicos.
      - run: python scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Actualizar tarjetas del perfil"
          git push
